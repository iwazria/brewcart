<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Liberty Roast Coffee</title>
<meta name="description" content="Small-batch roasted, proudly American">
<meta name="theme-color" content="#6F4E37">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M24 6c-3 4 3 6 0 10M36 6c-3 4 3 6 0 10' stroke='%23C89B5A' stroke-width='3.5' fill='none' stroke-linecap='round'/%3E%3Cpath d='M12 24h34v9a13 13 0 0 1-13 13h-8a13 13 0 0 1-13-13z' fill='%236F4E37'/%3E%3Cpath d='M46 27h2a8 8 0 0 1 0 16h-3' fill='none' stroke='%236F4E37' stroke-width='4'/%3E%3Crect x='9' y='52' width='40' height='4' rx='2' fill='%236F4E37'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="site-header"></div>

<main class="wrap">
  <section class="section narrow">
    <h1 class="page-title">Contact us</h1>

    <div class="info-cards">
      <div class="info-card">
        <h3>Phone</h3>
        <p data-fill="phone">+1 (512) 555-0147</p>
      </div>
      <div class="info-card">
        <h3>Address</h3>
        <p data-fill="address">1200 Congress Ave, Austin, TX</p>
      </div>
      <div class="info-card">
        <h3>Hours</h3>
        <p data-fill="hours">Mon-Sun, 7am to 9pm</p>
      </div>
    </div>

    <!-- This form has no server behind it: app.js opens WhatsApp with
         your message prefilled, addressed to the shop's number. -->
    <form class="form" id="contact-form" novalidate>
      <h3>Send us a message</h3>
      <div class="flash flash-error" id="contact-error" hidden><span></span></div>
      <div class="field-row">
        <div class="field">
          <label for="c-name">Your name *</label>
          <input id="c-name" type="text" name="name" maxlength="120" required>
        </div>
        <div class="field">
          <label for="c-contact">Phone or email *</label>
          <input id="c-contact" type="text" name="contact" maxlength="120" required>
        </div>
      </div>
      <div class="field">
        <label for="c-message">Message *</label>
        <textarea id="c-message" name="message" rows="5" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Send via WhatsApp</button>
      <p class="muted small">This opens WhatsApp with your message ready to send — nothing is stored on a server.</p>
    </form>
  </section>
</main>

<div id="site-footer"></div>
<div id="toast" class="toast" role="status"></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script src="site3d.js"></script>
</body>
</html>
